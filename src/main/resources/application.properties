spring.application.name=bank-recommendations
application.recommendations-db.url=jdbc:h2:file:./transaction
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
server.port=8081
# --- ????????? ?????? ?? (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/bank_rules
spring.datasource.username=bank_user
spring.datasource.password=bank_password
spring.datasource.driver-class-name=org.postgresql.Driver

# --- ????????? JPA ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- ????????? Liquibase ---
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml